name: CI

# Synthetic-only CI for a public repository.
#
# Default permissions are read-only and no job requests a production credential.
# `pull_request` (not `pull_request_target`) means fork code runs without access
# to repository secrets, which is the point: nothing here needs one. Actions are
# pinned to commit SHAs so a moved tag cannot change what executes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every job runs against fakes. A real key reaching CI is a defect, not a feature.
  SR_TEST_MODE: ci
  AI_PROVIDER: fake
  EMBEDDING_PROVIDER: fake
  APP_TIMEZONE: Asia/Taipei
  RESOURCE_BASE_URL: https://resources.example.com

jobs:
  verify:
    name: typecheck, lint, policy, unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the secret scan can inspect what is tracked, not just a shallow tip.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Private-path policy
        run: npm run check:private

      - name: Secret scan
        run: npm run check:secrets

      - name: Unit and integration tests
        run: npm test

  browser:
    name: deterministic browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser journeys
        run: npm run test:e2e

      # Reports can contain page text. Page text here is synthetic, but the upload is
      # still restricted to the report directory and never to an ignored private path.
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
